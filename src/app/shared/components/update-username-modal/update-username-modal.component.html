<div class="modal-backdrop" (click)="closeModal()"></div>

<div class="modal-content" (click)="$event.stopPropagation()">

  <div class="modal-header">

    <button class="back-btn" (click)="closeModal()">
        <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    

</div>

  <!-- Título -->
  <h1 class="title">Editar perfil</h1>

  <!-- Avatar -->
  <div class="avatar-container">
    <app-avatar
      [imageUrl]="profileImage"
      [username]="newUsername"
      [editable]="true"
      [showUsername]="false"
      (imageChange)="onImageChange($event)"
      (imageRemove)="onImageRemove()">
    </app-avatar>
  </div>

  <!-- Card -->
  <div class="card">

    <div class="input-container">
      <label for="pf-fullname">Nombre completo</label>
      <input
        id="pf-fullname"
        type="text"
        [(ngModel)]="newFullName"
        maxlength="100"
        autocomplete="name"
        placeholder="Ej. Luis Santiago">
    </div>

    <div class="input-container">
      <label for="pf-username">Nombre de usuario</label>
      <input
        id="pf-username"
        type="text"
        [(ngModel)]="newUsername"
        maxlength="50"
        placeholder="Sin espacios, ej. luis_santiago">
    </div>

    <div class="input-container">
      <label for="pf-phone">Teléfono (opcional)</label>
      <input
        id="pf-phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        [(ngModel)]="newPhone"
        maxlength="20"
        placeholder="Ej. 300 123 4567"
        (keyup.enter)="saveUsername()">
    </div>

    <button class="btn-save" (click)="saveUsername()">
      Guardar
    </button>

  </div>

</div>
