<div class="pet-stats-card">
  <div class="stats-row">
    <div class="stat-item">
      <div class="icon-wrap color-orange">
        <img src="assets/images/PetProfiile/EdadIcon.png" alt="" class="stat-icon" />
      </div>
      <span class="stat-value">{{ stats.age }}</span>
      <span class="stat-label">Edad</span>
    </div>
    <div class="stat-item">
      <div class="icon-wrap color-purple">
        <img src="assets/images/PetProfiile/PesoIcon.png" alt="" class="stat-icon" />
      </div>
      <span class="stat-value">{{ stats.weight }}</span>
      <span class="stat-label">Peso</span>
    </div>
    <div class="stat-item">
      <div class="icon-wrap color-orange">
        <img src="assets/images/PetProfiile/SexoIcon.png" alt="" class="stat-icon" />
      </div>
      <span class="stat-value">{{ stats.gender }}</span>
      <span class="stat-label">Sexo</span>
    </div>
    <div class="stat-item">
      <div class="icon-wrap color-purple">
        <img src="assets/images/PetProfiile/AlturaIcon.png" alt="" class="stat-icon" />
      </div>
      <span class="stat-value">{{ stats.height }}</span>
      <span class="stat-label">Altura</span>
    </div>
  </div>
</div>
