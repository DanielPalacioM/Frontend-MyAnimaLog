<div class="avatar-container">
  <div class="avatar-wrapper">

    <div class="avatar-circle" (click)="onAvatarClick()">
      <img [src]="imageUrl" alt="profile">
    </div>

  </div>

  <p class="username" *ngIf="showUsername">{{ username }}</p>

  <input
    type="file"
    id="fileInput"
    accept="image/*"
    (change)="onFileSelected($event)"
    style="display: none;">
</div>
