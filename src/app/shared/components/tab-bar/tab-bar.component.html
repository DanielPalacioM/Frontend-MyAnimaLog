<div class="tab-bar">
  <div
    class="tab-item"
    *ngFor="let tab of tabs"
    [class.active]="isActive(tab)"
    (click)="goTo(tab.route)">

    <div class="tab-icon-wrap">
      <img
        class="tab-icon"
        [src]="'assets/images/footer-bar/' + tab.icon"
        [alt]="tab.label" />
    </div>

    <span class="tab-label">{{ tab.label }}</span>

  </div>
</div>
