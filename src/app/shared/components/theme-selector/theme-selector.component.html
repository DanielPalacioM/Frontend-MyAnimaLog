<app-bottom-sheet
  [isOpen]="isOpen"
  title="Cambiar tema"
  (closed)="cancel()">

  <p class="theme-subtitle">
    ¿Quieres cambiar al tema {{ currentTheme === 'light' ? 'oscuro' : 'claro' }}?
  </p>

  <div class="theme-actions">
    <button class="btn-cancel" (click)="cancel()">Cancelar</button>
    <button class="btn-confirm" (click)="confirm()">Confirmar</button>
  </div>

</app-bottom-sheet>
