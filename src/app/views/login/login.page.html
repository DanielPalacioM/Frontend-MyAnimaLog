<ion-content fullscreen>
  <!-- fondo con olas -->
  <div class="bg">
    <div class="wave top"></div>
    <div class="wave bottom"></div>
  </div>

  <div class="login-container">
    <h1 class="title">MyAnimalog</h1>

    <div class="hero">
      <img class="dog-img" src="../../../assets/images/login dog.png" alt="dog">
    </div>

    <form class="form">
      <!-- Email (cambiado de Username) -->
      <div class="pill">
        <input 
          type="email" 
          placeholder="Email" 
          [(ngModel)]="email" 
          name="email"/>
      </div>

      <!-- Password con toggle -->
      <div class="pill">
        <input 
          [type]="passwordVisible ? 'text' : 'password'" 
          placeholder="Password" 
          [(ngModel)]="password" 
          name="password"/>
        
        <button 
          type="button" 
          class="eye" 
          aria-label="toggle password" 
          (click)="togglePassword()">
        </button>
      </div>

      <a class="forgot" (click)="GoToRecoverPassword()">Forgot password</a>

      <button 
        type="button" 
        class="btn-signup"
        (click)="onLogin()">
        Sign In
      </button>

      <div class="divider"><span>Or Sign With</span></div>

      <div class="socials">
        <!-- Gmail - Tu botón personalizado -->
        <button type="button" class="gmail-btn" (click)="loginWithGoogle()">
          <img src="../../../assets/images/google.png" alt="gm" />
        </button>

        <!-- 🔥 Botón invisible de Google (se clickea programáticamente) -->
        <div id="googleButtonDiv" style="display: none;"></div>

        <!-- Logo de la app que lleva al registro -->
        <button type="button" class="register-btn" (click)="goToRegister()">
          <img src="../../../assets/images/logo app.png" alt="dog icon" />
        </button>
      </div>
    </form>
  </div>
</ion-content>
