<div class="step-photo" [class.row]="editMode">

  <div class="avatar" [class.has-photo]="!!photo">
    <img *ngIf="photo" [src]="photo" alt="Foto de la mascota" />
    <ion-icon *ngIf="!photo" name="paw" aria-hidden="true"></ion-icon>
    <label class="badge" aria-label="Tomar foto" *ngIf="!editMode">
      <ion-icon name="camera-outline"></ion-icon>
      <input type="file" accept="image/*" capture="environment" class="file-input-hidden" (change)="onFile($event)" />
    </label>
    <button type="button" class="remove" *ngIf="photo" (click)="onRemovePhoto()" aria-label="Quitar foto">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <div class="side">
    <p class="hint">{{ editMode ? 'Foto de perfil' : (photo ? '¡Qué buena foto!' : 'Agrega una foto (opcional)') }}</p>
    <div class="actions">
      <label class="pill" *ngIf="!editMode">
        <ion-icon name="camera-outline"></ion-icon><span>Cámara</span>
        <input type="file" accept="image/*" capture="environment" class="file-input-hidden" (change)="onFile($event)" />
      </label>
      <label class="pill">
        <ion-icon [name]="editMode ? 'camera-outline' : 'image-outline'"></ion-icon><span>{{ editMode ? 'Cambiar foto' : 'Galería' }}</span>
        <input type="file" accept="image/*" class="file-input-hidden" (change)="onFile($event)" />
      </label>
    </div>
  </div>

</div>
