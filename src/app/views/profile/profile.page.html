<ion-content [fullscreen]="true">

  <!-- LANGUAGE SELECTOR -->
  <app-language-selector
    [isOpen]="showLanguage"
    [selectedLanguage]="selectedLanguage"
    (languageSelected)="selectLanguage($event)"
    (closed)="closeLanguage()">
  </app-language-selector>

  <!-- THEME SELECTOR -->
  <app-theme-selector
    [isOpen]="showThemeConfirm"
    [currentTheme]="currentTheme"
    (themeConfirmed)="confirmTheme($event)"
    (closed)="cancelTheme()">
  </app-theme-selector>

  <!-- HEADER -->
  <div class="header-section">
    <button class="back-btn" (click)="router.navigate(['/home'])">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h1 class="profile-title">Profile</h1>
  </div>

  <div class="user-card">
  <app-avatar
    [imageUrl]="profileImage"
    [username]="username"
    [editable]="true"
    [showUsername]="false"
    (imageChange)="onImageChange($event)"
    (imageRemove)="onImageRemove()">
  </app-avatar>
  <div class="user-info">
    <p class="user-name">{{ username }}</p>
    <p class="user-email">{{ email }}</p>
  </div>
</div>

  <!-- MENU SECTIONS -->
  <div class="menu-sections">

    <p class="section-label">Account</p>
    <div class="menu-card">
      <app-menu-item
        icon="assets/images/Profile/editProfileIcon.png"
        label="Edit profile"
        (clicked)="goToUpdateProfile()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/sharedProfileIcon.png"
        label="Shared profiles"
        (clicked)="goToSharedProfiles()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/NotificationIcon.png"
        label="Notifications"
        (clicked)="goToNotifications()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/LanguageIcon.png"
        label="Language"
        [suffix]="selectedLanguage === 'en' ? 'English' : 'Español'"
        (clicked)="goToLanguage()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/LogOutIcon.png"
        label="Log out"
        [isLogout]="true"
        (clicked)="onLogout()">
      </app-menu-item>
    </div>

    <p class="section-label">Preferences</p>
    <div class="menu-card">
      <app-menu-item
        icon="assets/images/Profile/AboutUsIcon.png"
        label="About us"
        (clicked)="goToAboutUs()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/ThemeIcon.png"
        label="Theme"
        [suffix]="currentTheme === 'light' ? 'Light' : 'Dark'"
        (clicked)="goToTheme()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/SocialMediaIcon.png"
        label="Social media"
        (clicked)="goToSocialMedia()">
      </app-menu-item>
    </div>

    <p class="section-label">Support</p>
    <div class="menu-card">
      <app-menu-item
        icon="assets/images/Profile/HelpCenterIcon.png"
        label="Help Center"
        (clicked)="goToHelpCenter()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/BugsReport.png"
        label="Bugs report"
        (clicked)="goToBugsReport()">
      </app-menu-item>
      <app-menu-item
        icon="assets/images/Profile/FeedBackIcon.png"
        label="Feedback"
        (clicked)="goToFeedback()">
      </app-menu-item>
    </div>

  </div>

</ion-content>
