<ion-content fullscreen>
  <div class="reset-container">
    <div class="reset-card">
      <img src="assets/images/changePassword.png" alt="" class="reset-img" />

      <ng-container *ngIf="!done; else successTpl">
        <h1>Nueva contraseña</h1>
        <p class="reset-text">Escribe tu nueva contraseña para tu cuenta.</p>

        <div class="field">
          <input [type]="passwordVisible ? 'text' : 'password'" placeholder="Nueva contraseña"
                 [(ngModel)]="newPassword" autocomplete="new-password" />
          <button type="button" class="eye" (click)="togglePassword()">
            <ion-icon [name]="passwordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>

        <div class="field">
          <input [type]="passwordVisible ? 'text' : 'password'" placeholder="Confirmar contraseña"
                 [(ngModel)]="confirmPassword" autocomplete="new-password"
                 (keyup.enter)="submit()" />
        </div>

        <p class="hint">Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.</p>
        <p class="reset-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button class="btn-primary" type="button" [disabled]="saving || !token" (click)="submit()">
          {{ saving ? 'Guardando...' : 'Cambiar contraseña' }}
        </button>
        <a class="link" (click)="requestNewLink()">Solicitar un nuevo link</a>
      </ng-container>

      <ng-template #successTpl>
        <h1>¡Listo!</h1>
        <p class="reset-text">Tu contraseña se cambió correctamente. Ya puedes iniciar sesión.</p>
        <button class="btn-primary" type="button" (click)="goToLogin()">Ir al login</button>
      </ng-template>
    </div>
  </div>
</ion-content>
